<svg xmlns="http://www.w3.org/2000/svg" width="410" height="130" viewBox="0 0 410 130">
  <!-- isometric cube: cyan top, plum left, amber right -->
  <polygon points="58,26 92,45 58,64 24,45" fill="#35B7CC" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="24,45 58,64 58,102 24,83" fill="#7A35B0" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="58,64 92,45 92,83 58,102" fill="#F37024" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/>

  <!-- small floating green cube -->
  <polygon points="102,8 110,12 102,16 94,12" fill="#B6E36A" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="94,12 102,16 102,26 94,22" fill="#84C225" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="102,16 110,12 110,22 102,26" fill="#5E9A12" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>

  <text x="124" y="76" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="40" font-weight="700"
        fill="#1E1625">Color<tspan fill="#F37024">Boxes</tspan></text>

  <text x="125" y="100" font-family="'Trebuchet MS', Verdana, sans-serif" font-size="14" letter-spacing="3"
        fill="#158597">LIGHT THEME</text>
</svg>
